<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="A front-end template that helps you build fast, modern mobile web apps.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>个人信息</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Material Design Lite">
    <meta name="msapplication-TileImage" content="images/touch/ms-touch-icon-144x144-precomposed.png">
    <meta name="msapplication-TileColor" content="#3372DF">
    <link rel="icon" sizes="192x192" th:href="@{/frontStatic/image/logo.png}">
    <link rel="apple-touch-icon-precomposed" th:href="@{/frontStatic/image/logo.png}">
    <link rel="shortcut icon" th:href="@{/frontStatic/image/logo.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:regular,bold,italic,thin,light,bolditalic,black,medium&amp;lang=en">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" th:href="@{https://code.getmdl.io/1.3.0/material.cyan-light_blue.min.css}">
    <link rel="stylesheet" th:href="@{/frontStatic/css/infostyle.css}">
    <link rel="stylesheet" th:href="@{/frontStatic/css/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/frontStatic/css/sweetalert.css}">
    <link rel="stylesheet" th:href="@{/frontStatic/css/font-awesome.min.css}">
    <!-- 引入JS，保持原有顺序，确保修改密码功能正常 -->
    <script type="text/javascript" th:src="@{/frontStatic/js/jquery.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/sweetalert.min.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/css/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/front/information.js}"></script>
    <style>
        /* ====================================== */
        /* 移植：橘色系背景 + 遮罩层（和订单/菜单页面一致） */
        /* ====================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 橘色系渐变背景 + 轻微纹理 */
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 30%, #FF8C00 60%, #FFA500 100%) center center fixed;
            background-size: cover;
            color: #f5f5f5; /* 浅白色文字，适配橘色背景 */
            font-family: 'Microsoft Yahei', 'PingFang SC', Arial, sans-serif;
            line-height: 1.5;
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        /* 橘色系半透明遮罩，增强层次感 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(51, 26, 0, 0.7); /* 深橘色遮罩，可调整透明度 */
            z-index: -1;
        }

        /* ====================================== */
        /* 移植：悬浮购物车（保留原有hover颜色，适配橘色系玻璃拟态） */
        /* ====================================== */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 13%;
            color: rgba(237, 133, 57, 0.5); /* 亮橘色主色 */
            cursor: pointer;
            width: 60px;
            height: 60px;
            font-size: 40px;
            /* 玻璃拟态：购物车按钮 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: all 0.3s ease;
        }

        /* 保留原有hover颜色（deepskyblue），增强动画效果 */
        .floating-cart:hover {
            color: deepskyblue !important; /* 保留原有hover颜色 */
            background: rgba(255, 255, 255, 0.2); /* 浅白色背景 */
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 5px 25px rgba(0, 191, 255, 0.6); /* 天蓝色阴影 */
        }

        /* ====================================== */
        /* 移植：右侧横向导航样式（和订单/菜单页面一致） */
        /* ====================================== */
        .top-nav-right {
            display: flex;
            align-items: center;
            margin-left: auto;
            padding: 0;
            list-style: none;
        }

        .top-nav-right li {
            margin-left: 20px;
        }

        .top-nav-right a {
            color: #f5f5f5 !important; /* 浅白色文字 */
            font-size: 14px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .top-nav-right a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #FFD700 !important; /* 金黄色hover文字 */
        }

        .top-nav-right .material-icons {
            margin-right: 6px;
            font-size: 16px;
        }

        .logout-btn {
            color: #FFE4B5 !important; /* 浅橘色退出按钮 */
        }

        .logout-btn:hover {
            background-color: rgba(255, 127, 80, 0.2) !important;
            color: #FF6347 !important; /* 番茄红hover */
        }

        /* ====================================== */
        /* 移植：MDL导航栏（橘色系玻璃拟态，和订单/菜单页面一致） */
        /* ====================================== */
        .demo-layout .mdl-layout__header {
            background: rgba(139, 69, 19, 0.6) !important; /* 深橘色玻璃拟态 */
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3) !important;
            min-height: 60px !important;
            height: 60px !important;
            color: #ffffff !important; /* 白色文字 */
        }

        .demo-header .mdl-layout-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            color: #ffffff !important; /* 白色文字适配 */
        }

        .demo-header .logo {
            height: 40px;
            width: 40px;
            margin-right: 12px;
        }

        /* ====================================== */
        /* 移植：主内容区域（橘色系玻璃拟态，适配个人信息页面） */
        /* ====================================== */
        .mdl-layout__content {
            background: rgba(160, 82, 45, 0.5) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border-radius: 12px;
            margin: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            min-height: 80vh;
        }

        /* ====================================== */
        /* 优化：个人信息页面卡片/表格样式，重点优化排版对齐 */
        /* ====================================== */
        .demo-charts {
            background: rgba(188, 114, 64, 0.5) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
            padding: 30px !important; /* 增加内边距，更舒展 */
            margin-bottom: 20px !important;
            max-width: 800px !important; /* 限制卡片宽度，避免过宽 */
            margin: 0 auto !important; /* 卡片居中 */
        }

        h3, .mdl-layout-title span {
            color: #ffffff !important; /* 白色标题 */
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
            margin-bottom: 20px !important;
            font-weight: 600 !important;
            text-align: center; /* 标题居中 */
        }

        /* 优化：个人信息表格样式 */
        .info-table {
            color: #ffffff !important; /* 白色表格文字 */
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            overflow: hidden !important;
            width: 100% !important;
            max-width: 600px !important; /* 限制表格宽度 */
            margin: 0 auto !important; /* 表格居中 */
            border-collapse: separate !important;
            border-spacing: 0 !important;
        }

        /* 优化：表头列（左侧标签） */
        .info-table th {
            width: 30% !important; /* 固定表头宽度 */
            padding: 15px !important; /* 增加内边距 */
            background: rgba(139, 69, 19, 0.5) !important; /* 深橘色表头背景 */
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            text-align: right !important; /* 表头文字右对齐，更美观 */
            font-weight: 500 !important;
            white-space: nowrap; /* 防止文字换行 */
        }

        /* 优化：内容列（右侧值） */
        .info-table td {
            width: 70% !important; /* 固定内容宽度 */
            padding: 15px !important; /* 增加内边距 */
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            text-align: left !important; /* 内容文字左对齐，与表头呼应 */
            vertical-align: middle !important;
        }

        /* 优化：表格第一行的圆角 */
        .info-table tr:first-child th {
            border-top-left-radius: 8px !important;
        }
        .info-table tr:first-child td {
            border-top-right-radius: 8px !important;
        }

        /* 优化：表格最后一行的圆角 */
        .info-table tr:last-child th {
            border-bottom-left-radius: 8px !important;
        }
        .info-table tr:last-child td {
            border-bottom-right-radius: 8px !important;
        }

        .table-bordered {
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        /* ====================================== */
        /* 原有样式：修改密码按钮样式（适配橘色系，保留功能）+ 优化按钮位置 */
        /* ====================================== */
        .templatemo-blue-button {
            background-color: #FF9800 !important; /* 橘色按钮（替换原39ADB4） */
            border: none;
            color: white;
            padding: 10px 20px; /* 调整按钮内边距 */
            border-radius: 6px; /* 增加圆角 */
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px; /* 调整字体大小 */
            margin: 20px auto 0 !important; /* 按钮居中，增加上边距 */
            display: block !important; /* 按钮块级显示，实现居中 */
        }

        .templatemo-blue-button:hover {
            background-color: #FF8C00 !important;
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.4);
            transform: translateY(-2px); /* 轻微上浮，增强交互 */
        }

        .no-border {
            border: 0 solid transparent !important;
        }

        /* ====================================== */
        /* 新增：修改密码模态框样式适配橘色系，避免冲突 */
        /* ====================================== */
        #update-Psw .modal-content {
            background: rgba(160, 82, 45, 0.8) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 12px !important;
            color: #ffffff !important;
        }

        #update-Psw .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        #update-Psw .modal-title {
            color: #ffffff !important;
        }

        #update-Psw .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            border-radius: 6px !important;
        }

        #update-Psw .btn-default {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            border-radius: 6px !important;
        }

        #update-Psw .btn-default:hover {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        #update-Psw .btn-primary {
            background: #FF9800 !important;
            border: none !important;
            border-radius: 6px !important;
            color: #ffffff !important;
        }

        #update-Psw .btn-primary:hover {
            background: #FF8C00 !important;
        }

        #oldPswError label {
            color: #FF6347 !important; /* 错误提示色，更醒目 */
        }

        /* ====================================== */
        /* 移植：兼容不支持backdrop-filter的浏览器 */
        /* ====================================== */
        @supports not (backdrop-filter: blur(1px)) {
            body::before {
                background: rgba(51, 26, 0, 0.9);
            }
            .mdl-layout__content {
                background: linear-gradient(145deg, #8B4513 0%, #D2691E 100%) !important;
            }
            .demo-charts {
                background: #8B4513 !important;
            }
            .floating-cart {
                background: #8B4513;
            }
            .demo-layout .mdl-layout__header {
                background: #8B4513 !important;
            }
            .info-table {
                background: rgba(139, 69, 19, 0.8) !important;
            }
            #update-Psw .modal-content {
                background: #8B4513 !important;
            }
        }

        /* ====================================== */
        /* 移植：响应式适配 + 表格响应式优化 */
        /* ====================================== */
        @media (max-width: 768px) {
            .top-nav-right {
                flex-wrap: wrap;
                margin-left: 0;
                margin-top: 10px;
            }
            .top-nav-right li {
                margin-left: 10px;
                margin-bottom: 5px;
            }
            .mdl-layout__content {
                margin: 5px;
                padding: 10px;
            }
            .floating-cart {
                right: 5%;
                width: 50px;
                height: 50px;
                font-size: 30px;
            }
            /* 响应式：表格列宽自适应，文字居中 */
            .info-table th {
                width: 40% !important;
                text-align: center !important;
                padding: 10px !important;
            }
            .info-table td {
                width: 60% !important;
                text-align: center !important;
                padding: 10px !important;
            }
            .demo-charts {
                padding: 20px !important;
                max-width: 100% !important;
            }
            .templatemo-blue-button {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<!-- ====================================== -->
<!-- 替换：顶部固定导航布局（和订单/菜单页面一致） -->
<!-- ====================================== -->
<div class="demo-layout mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <!-- 顶部导航栏（包含右侧横向导航，和订单/菜单页面一致） -->
    <header class="demo-header mdl-layout__header">
        <div class="mdl-layout__header-row" style="padding: 0 24px;">
            <!-- 左侧Logo + 页面标题 -->
            <div class="mdl-layout-title" style="display: flex; align-items: center;">
                <img class="logo" th:src="@{/admin/images/大食堂.jpg}" alt="大食堂logo">
                <span>大食堂 - 个人信息</span>
            </div>

            <!-- 右侧横向导航（和订单/菜单页面完全一致） -->
            <ul class="top-nav-right">
                <li>
                    <a th:href="@{/front/toMain}">
                        <i class="material-icons">menu_book</i>菜单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toOrder}">
                        <i class="material-icons">receipt</i>今日订单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toMonOrder}">
                        <i class="material-icons">insert_chart</i>月度订单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toInfo}">
                        <i class="material-icons">person</i>个人信息
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/logout}" class="logout-btn">
                        <i class="material-icons">exit_to_app</i>退出
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <!-- ====================================== -->
    <!-- 保留：修改密码模块（核心功能，ID不变） -->
    <!-- ====================================== -->
    <div class="modal fade" id="update-Psw" tabindex="-1" role="dialog" aria-labelledby="myModalLabelPsw">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title" id="myModalLabelPsw">修改密码</h4>
                </div>
                <div class="modal-body">
                    <form class="form-horizontal" id="updatePsw-form" name="update-form" method="post">
                        <div class="form-group">
                            <label for="oldPsw" class="col-sm-2 control-label">旧密码</label>
                            <div class="col-sm-9">
                                <input type="password" class="form-control" name="oldPsw" id="oldPsw">
                            </div>
                        </div>
                        <div class="form-group" style="display: none" id="oldPswError">
                            <label class="col-sm-2 control-label"></label>
                            <div class="col-sm-9">
                                <label style="color: #BD1F3B">旧密码不一致</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="newPsw" class="col-sm-2 control-label">新密码</label>
                            <div class="col-sm-9">
                                <input type="password" class="form-control" name="newPsw" id="newPsw">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="savePsw" value="${pageContext.request.contextPath}">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====================================== -->
    <!-- 主内容区域：保留个人信息展示，优化排版对齐 -->
    <!-- ====================================== -->
    <main class="mdl-layout__content">
        <div class="mdl-grid demo-content">
            <div class="demo-charts mdl-color--white mdl-shadow--2dp mdl-cell mdl-cell--12-col mdl-grid">
                <!-- 新增：个人信息标题，居中显示 -->
                <h3>个人信息详情</h3>
                <div class="tab-content">
                    <!-- 优化：添加info-table类，控制表格样式 -->
                    <table class="info-table" cellpadding="6" cellspacing="1">
                        <tbody>
                        <tr>
                            <th class="tl">用户昵称</th>
                            <td class="tr" id="nameVal" th:text="${session.currUser.name}">无</td>
                        </tr>
                        <tr>
                            <th class="tl">用户账号</th>
                            <td class="tr" id="usernameVal" th:text="${session.currUser.username}">无</td>
                        </tr>
                        <tr>
                            <th class="tl">性别</th>
                            <td class="tr" id="sexVal" th:text="${session.currUser.sex}">无</td>
                        </tr>
                        <tr>
                            <th class="tl">部门</th>
                            <td class="tr" id="departmentVal" th:text="${session.currUser.department}">无</td>
                        </tr>
                        <tr>
                            <th class="tl">手机号</th>
                            <td class="tr" id="telephoneVal" th:text="${session.currUser.telephone}">无</td>
                        </tr>
                        <tr>
                            <th class="tl">角色</th>
                            <td class="tr" id="roleVal" th:text="${session.currUser.role}">无</td>
                        </tr>
                        <!-- 保留：密码隐藏域，修改密码功能依赖（移到表格外，避免排版干扰） -->
                        </tbody>
                    </table>
                    <!-- 密码隐藏域移到表格外，不影响排版 -->
                    <input type="hidden" th:value="${session.currUser.password}" id="Psw"/>
                </div>
                <div class="mdl-card__actions mdl-card--border">
                    <!-- 保留：修改密码按钮，ID不变 -->
                    <button class="templatemo-blue-button" id="changePsw"><h5>修改密码</h5></button>
                </div>
            </div>
        </div>

        <!-- ====================================== -->
        <!-- 新增：悬浮购物车（和订单/菜单页面一致） -->
        <!-- ====================================== -->
        <a th:href="@{/front/toShopCart}" class="floating-cart">
            <i class="fa fa-shopping-cart"></i>
        </a>
    </main>
</div>

<!-- 保留：MDL框架JS，确保导航栏功能正常 -->
<script type="text/javascript" th:src="@{https://code.getmdl.io/1.3.0/material.min.js}"></script>
</body>
</html>
