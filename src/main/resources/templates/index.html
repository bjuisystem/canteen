<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>主页</title>

	<!-- 依 赖 样 式 -->
	<link rel="stylesheet" th:href="@{/component/pear/css/pear.css}" />
	<!-- 加 载 样 式 -->
	<link rel="stylesheet" th:href="@{/admin/css/loader.css}" />
	<!-- 布 局 样 式 -->
	<link rel="stylesheet" th:href="@{/admin/css/admin.css}" />
</head>
<!-- 结 构 代 码 -->
<body class="layui-layout-body pear-admin">
<!-- 布 局 框 架 -->
<div class="layui-layout layui-layout-admin">
	<!-- 顶 部 样 式 -->
	<div class="layui-header">
		<!-- 优化：标题居中更优雅，替换固定margin为flex居中 -->
		<h2 style="font-size: 50px; font-weight: 600; color: #b76c16; display: inline-block; font-family: '楷体'; letter-spacing: 0.5em; position: absolute; left: 50%; transform: translateX(-50%);">大 食 堂</h2>
		<!-- 菜 单 顶 部 -->
		<div class="layui-logo">
			<!-- 图 标 -->
			<img class="logo" th:src="@{/images/logo.png}" alt="logo"> <!-- 补充logo路径，可自行修改 -->
			<!-- 标 题 -->
			<span class="title">大食堂管理系统</span> <!-- 补充标题文字 -->
		</div>
		<!-- 顶 部 左 侧 功 能 -->
		<!--				<ul class="layui-nav layui-layout-left">-->
		<!--					<li class="collapse layui-nav-item"><a href="#" class="layui-icon layui-icon-shrink-right"></a></li>-->
		<!--					<li class="layui-nav-item layui-hide-xs"><a href="#" class="fullScreen layui-icon layui-icon-screen-full"></a></li>-->
		<!--					<li class="refresh layui-nav-item"><a href="#" class="layui-icon layui-icon-refresh-1" loading = 600></a></li>-->
		<!--				</ul>-->
		<!-- 多 系 统 菜 单 -->
		<div id="control" class="layui-layout-control"></div>
		<!-- 顶 部 右 侧 菜 单 -->
		<ul class="layui-nav layui-layout-right">
			<!-- 移除多余的“大食堂”文字，避免重复 -->
			<!--					<li class="layui-nav-item layui-hide-xs message"></li>-->
			<li class="layui-nav-item user">
				<!-- 头 像 -->
				<a class="layui-icon layui-icon-username" href="javascript:;"></a>
				<!-- 功 能 菜 单 -->
				<dl class="layui-nav-child">
					<dd><a th:user-menu-url="|@{/back/toPerson}|" user-menu-id="0" user-menu-title="个人信息">个人信息</a></dd>
					<dd><a href="javascript:void(0);" class="logout">退出登录</a></dd>
				</dl>
			</li>
			<!-- 主 题 配 置 -->
			<li class="layui-nav-item setting"><a href="#" class="layui-icon layui-icon-more-vertical"></a></li>
		</ul>
	</div>
	<!-- 侧 边 区 域：移除layui-bg-black（CSS中已重写，避免冲突） -->
	<div class="layui-side">
		<!-- 菜 单 顶 部 -->
		<div class="layui-logo" style="height: 120px">
			<!-- 图 标：补充logo路径，优化样式 -->
			<img class="logo" th:src="@{/images/side-logo.png}" alt="logo" style="display: inline-block; height: 80px; width: 80px; border-radius: 8px;">
			<!-- 标 题：如需显示可移除display: none -->
			<span class="title" style="display: none; color: #5FB878; font-size: 20px;">企业食堂</span>
		</div>
		<!-- 菜 单 内 容 -->
		<div class="layui-side-scroll">
			<div id="sideMenu"></div>
		</div>
	</div>
	<!-- 视 图 页 面 -->
	<div class="layui-body">
		<!-- 内 容 页 面 -->
		<div id="content"></div>
	</div>
	<!-- 页脚 -->
	<div class="layui-footer layui-text">
		<span class="left">
			Released under the MIT license.
		</span>
		<span class="center"></span>
		<span class="right">
			Copyright © 200747-javaweb
		</span>
	</div>
	<!-- 遮 盖 层 -->
	<div class="pear-cover"></div>
	<!-- 加 载 动 画 -->
	<div class="loader-main">
		<!-- 动 画 对 象 -->
		<div class="loader"></div>
	</div>
</div>
<!-- 移 动 端 便 捷 操 作 -->
<div class="pear-collapsed-pe collapse">
	<a href="#" class="layui-icon layui-icon-shrink-right"></a>
</div>
<!-- 依 赖 脚 本 -->
<script th:src="@{/component/layui/layui.js}"></script>
<script th:src="@{/component/pear/pear.js}"></script>
<!-- 框 架 初 始 化 -->
<script>
	layui.use(['admin','jquery','popup','drawer'], function() {
		var $ = layui.jquery;
		var admin = layui.admin;
		var popup = layui.popup;

		admin.setConfigType("yml");
		admin.setConfigPath("/config/pear.config.yml");

		admin.render();

		// 登出逻辑
		admin.logout(function(){
			$.ajax({
				url: "/login/logout",
				type: "get",
				dataType: "json",
				success: function (res){
					if (res.code === 200) {
						popup.success(res.data,function(){
							location.href = "/login";
						})
						// 注销逻辑 返回 true / false
						return true;
					}else{
						popup.failure("注销失败", function (){
							return false;
						})
					}
				}
			});

		})
	})
</script>
</body>
</html>
