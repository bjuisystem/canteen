<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="A front-end template that helps you build fast, modern mobile web apps.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Material Design Lite">
    <meta name="msapplication-TileImage" content="images/touch/ms-touch-icon-144x144-precomposed.png">
    <meta name="msapplication-TileColor" content="#3372DF">
    <title>我的月度订单</title>
    <link rel="icon" sizes="192x192" th:href="@{/frontStatic/image/logo.png}">
    <link rel="apple-touch-icon-precomposed" th:href="@{/frontStatic/image/logo.png}">
    <link rel="shortcut icon" th:href="@{/frontStatic/image/logo.png}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:regular,bold,italic,thin,light,bolditalic,black,medium&amp;lang=en">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" th:href="@{https://code.getmdl.io/1.3.0/material.cyan-light_blue.min.css}">
    <link rel="stylesheet" th:href="@{/frontStatic/css/infostyle.css}">
    <link rel="stylesheet" th:href="@{/frontStatic/css/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/frontStatic/css/sweetalert.css}">
    <script type="text/javascript" th:src="@{/frontStatic/js/jquery.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/css/bootstrap/js/bootstrap.min.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/sweetalert.min.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/distpicker.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/jquery.raty.js}"></script>
    <script type="text/javascript" th:src="@{/frontStatic/js/front/list.js}"></script>
    <link rel="stylesheet" th:href="@{/frontStatic/css/font-awesome.min.css}">
    <style>
        /* ====================================== */
        /* 核心修改：橘色系背景 + 遮罩层（和其他页面一致） */
        /* ====================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 橘色系渐变背景 + 轻微纹理 */
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 30%, #FF8C00 60%, #FFA500 100%) center center fixed;
            background-size: cover;
            color: #f5f5f5; /* 浅白色文字，适配橘色背景 */
            font-family: 'Microsoft Yahei', 'PingFang SC', Arial, sans-serif;
            line-height: 1.5;
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        /* 橘色系半透明遮罩，增强层次感 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(51, 26, 0, 0.7); /* 深橘色遮罩，可调整透明度 */
            z-index: -1;
        }

        /* ====================================== */
        /* 悬浮购物车：保留原有hover颜色（#F22E00），适配橘色系玻璃拟态样式 */
        /* ====================================== */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 13%;
            color: rgba(232, 112, 27, 0.5); /* 亮橘色主色（替换原红色） */
            cursor: pointer;
            width: 60px;
            height: 60px;
            font-size: 40px;
            /* 玻璃拟态：购物车按钮 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: all 0.3s ease;
        }

        /* 保留原有hover颜色（#F22E00），增强动画效果 */
        .floating-cart:hover {
            color: #F22E00 !important; /* 保留原有hover颜色 */
            background: rgba(255, 255, 255, 0.2); /* 浅白色背景 */
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 5px 25px rgba(242, 46, 0, 0.6); /* 对应颜色阴影 */
        }

        .templatemo-blue-button {
            background-color: #FF9800 !important; /* 橘色按钮（替换原39ADB4） */
            border: none;
            color: white !important;
            padding: 8px 20px !important;
            border-radius: 6px !important;
            transition: all 0.3s ease !important;
        }

        .templatemo-blue-button:hover {
            background-color: #FF8C00 !important; /* 深橘色hover */
            transform: translateY(-2px) !important;
            box-shadow: 0 4px 10px rgba(255, 140, 0, 0.4) !important;
        }

        .no-border {
            border: 0 solid transparent !important;
        }

        .finish-btn {
            background-color: #e65b0e !important; /* 保留原有橙色按钮 */
        }

        .font-color {
            color: #FFD700 !important; /* 金黄色（替换原00BBD6） */
        }

        /* ====================================== */
        /* 右侧横向导航样式（和其他页面一致） */
        /* ====================================== */
        .top-nav-right {
            display: flex;
            align-items: center;
            margin-left: auto;
            padding: 0;
            list-style: none;
        }

        .top-nav-right li {
            margin-left: 20px;
        }

        .top-nav-right a {
            color: #f5f5f5 !important; /* 浅白色文字 */
            font-size: 14px;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .top-nav-right a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #FFD700 !important; /* 金黄色hover文字 */
        }

        .top-nav-right .material-icons {
            margin-right: 6px;
            font-size: 16px;
        }

        .logout-btn {
            color: #FFE4B5 !important; /* 浅橘色退出按钮 */
        }

        .logout-btn:hover {
            background-color: rgba(255, 127, 80, 0.2) !important;
            color: #FF6347 !important; /* 番茄红hover */
        }

        /* ====================================== */
        /* MDL导航栏：橘色系玻璃拟态（和其他页面一致） */
        /* ====================================== */
        .demo-layout .mdl-layout__header {
            background: rgba(139, 69, 19, 0.6) !important; /* 深橘色玻璃拟态 */
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3) !important;
            min-height: 60px !important;
            height: 60px !important;
            color: #ffffff !important; /* 白色文字 */
        }

        .demo-header .mdl-layout-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            color: #ffffff !important; /* 白色文字适配 */
        }

        .demo-header .logo {
            height: 40px;
            width: 40px;
            margin-right: 12px;
        }

        /* ====================================== */
        /* 主内容区域：橘色系玻璃拟态（适配月度订单页面） */
        /* ====================================== */
        .mdl-layout__content {
            background: rgba(160, 82, 45, 0.5) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            border-radius: 12px;
            margin: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            min-height: 80vh;
        }

        /* ====================================== */
        /* 月度订单页面表格/卡片样式适配橘色系 */
        /* ====================================== */
        .demo-charts {
            background: rgba(230, 149, 105, 0.93) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3) !important;
            padding: 20px !important;
            margin-bottom: 20px !important;
        }

        h3, h5 {
            color: #ffffff !important; /* 白色标题 */
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5) !important;
            margin-bottom: 20px !important;
            font-weight: 600 !important;
        }

        .table {
            color: #ffffff !important; /* 白色表格文字 */
            background: rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            overflow: hidden !important;
        }

        .table th, .table td {
            border-color: rgba(255, 255, 255, 0.2) !important; /* 浅白色边框 */
            padding: 12px !important;
            vertical-align: middle !important;
        }

        .table thead th {
            background: rgba(139, 69, 19, 0.5) !important; /* 深橘色表头背景 */
            border-bottom: 2px solid rgba(255, 255, 255, 0.3) !important;
            font-weight: 500 !important;
        }

        .table-bordered {
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        /* ====================================== */
        /* 兼容不支持backdrop-filter的浏览器 */
        /* ====================================== */
        @supports not (backdrop-filter: blur(1px)) {
            body::before {
                background: rgba(51, 26, 0, 0.9);
            }
            .mdl-layout__content {
                background: linear-gradient(145deg, #8B4513 0%, #D2691E 100%) !important;
            }
            .demo-charts {
                background: #8B4513 !important;
            }
            .floating-cart {
                background: #8B4513;
            }
            .demo-layout .mdl-layout__header {
                background: #8B4513 !important;
            }
            .table {
                background: rgba(139, 69, 19, 0.8) !important;
            }
        }

        /* ====================================== */
        /* 响应式适配 */
        /* ====================================== */
        @media (max-width: 768px) {
            .top-nav-right {
                flex-wrap: wrap;
                margin-left: 0;
                margin-top: 10px;
            }
            .top-nav-right li {
                margin-left: 10px;
                margin-bottom: 5px;
            }
            .mdl-layout__content {
                margin: 5px;
                padding: 10px;
            }
            .floating-cart {
                right: 5%;
                width: 50px;
                height: 50px;
                font-size: 30px;
            }
            .table th, .table td {
                padding: 8px !important;
                font-size: 14px !important;
            }
            h3 {
                font-size: 18px !important;
            }
            h5 {
                font-size: 14px !important;
            }
            .templatemo-blue-button {
                padding: 6px 15px !important;
            }
        }
    </style>
</head>
<body>
<!-- 移除原有bg-container，改用body背景+伪元素遮罩 -->

<!-- 替换为顶部固定导航布局（和其他页面一致） -->
<div class="demo-layout mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <!-- 顶部导航栏（包含右侧横向导航） -->
    <header class="demo-header mdl-layout__header">
        <div class="mdl-layout__header-row" style="padding: 0 24px;">
            <!-- 左侧Logo + 页面标题 -->
            <div class="mdl-layout-title" style="display: flex; align-items: center;">
                <img class="logo" src="/admin/images/大食堂.jpg" alt="大食堂logo">
                <span>大食堂 - 月度订单</span>
            </div>

            <!-- 右侧横向导航（和其他页面完全一致） -->
            <ul class="top-nav-right">
                <li>
                    <a th:href="@{/front/toMain}">
                        <i class="material-icons">menu_book</i>菜单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toOrder}">
                        <i class="material-icons">receipt</i>今日订单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toMonOrder}">
                        <i class="material-icons">insert_chart</i>月度订单
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/toInfo}">
                        <i class="material-icons">person</i>个人信息
                    </a>
                </li>
                <li>
                    <a th:href="@{/front/logout}" class="logout-btn">
                        <i class="material-icons">exit_to_app</i>退出
                    </a>
                </li>
            </ul>
        </div>
    </header>

    <!-- 主内容区域（保留月度订单核心功能，适配新样式） -->
    <main class="mdl-layout__content">
        <div class="mdl-grid demo-content" id="parent">
            <div class="demo-charts mdl-color--white mdl-shadow--2dp mdl-cell mdl-cell--12-col mdl-grid">
                <h3>订单统计</h3>
                <div class="demo-charts mdl-color--white mdl-shadow--2dp mdl-cell mdl-cell--12-col mdl-grid">
                    <div class="tab-content col-lg-12">
                        <table class="table " cellpadding="6" cellspacing="1">
                            <tbody>
                            <td class="no-border col-lg-9" th:text="'姓名：' + ${session.currUser.name} + '&nbsp;&nbsp;&nbsp;电话:' + ${session.currUser.telephone} + '&nbsp;&nbsp;&nbsp;统计月份：' + ${session.monDate}">
                            </td>
                            <td class="no-border col-lg-3" th:text="'月度总消费:' + ${session.monTotalPrice}">
                            </td>
                            </tbody>
                        </table>
                        <table class="table " cellpadding="6" cellspacing="1">
                            <tbody>
                            <tr>
                                <td class="col-lg-2">
                                    下单时间
                                </td>
                                <td class="col-lg-1">
                                    菜品名称
                                </td>
                                <td class="col-lg-2">
                                    计量单位
                                </td>
                                <td class="col-lg-1">
                                    数量
                                </td>
                                <td class="col-lg-2">
                                    总金额
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <table class="table table-bordered" cellpadding="6" cellspacing="1" th:each="bo:${session.monBlanketOrderList}">
                            <tbody>
                            <tr>
                                <td class="col-lg-2" th:text="${#dates.format(bo.createTime, 'yyyy-MM-dd HH:mm:ss')}">
                                    XXX
                                </td>
                                <td class="col-lg-1" th:text="${bo.name}">
                                    XXX
                                </td>
                                <td class="col-lg-2" th:text="${bo.unit}">
                                    XXX
                                </td>
                                <td class="col-lg-1" th:text="${bo.weight}">
                                    XXX
                                </td>
                                <td class="col-lg-2" th:text="${bo.totalPrice}">
                                    XXX
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="mdl-card__actions mdl-card--border">
                        <button class="templatemo-blue-button " name="finishList" value="${pageContext.request.contextPath}"><h5>打印流水</h5></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 悬浮购物车（保留原有hover颜色效果，样式适配橘色系） -->
        <a th:href="@{/front/toShopCart}" class="floating-cart">
            <i class="fa fa-shopping-cart"></i>
        </a>
    </main>
</div>

<script type="text/javascript" th:src="@{https://code.getmdl.io/1.3.0/material.min.js}"></script>
</body>
</html>
